plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id("io.freefair.lombok") version "9.5.0"
	id("org.sonarqube") version "7.2.3.7755"
	id 'checkstyle'
	id "io.sentry.jvm.gradle" version "6.9.0"
}

group = 'hexlet.code'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.openapitools:jackson-databind-nullable:0.2.10'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'

	implementation'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	implementation 'io.sentry:sentry-spring-boot-4:8.43.0'

	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

bootJar {
	archiveFileName = 'app.jar'
}

checkstyle {
	configFile = file('config/checkstyle/checkstyle.xml')
}

sonar {
	properties {
		property("sonar.projectKey", "nnsquik_java-project-99")
		property("sonar.organization", "nesquik")
		property 'sonar.host.url', 'https://sonarcloud.io'
	}
}

sentry {
	def hasAuthToken = System.getenv("SENTRY_AUTH_TOKEN") != null

	includeSourceContext = hasAuthToken

	autoUploadSourceContext = hasAuthToken

	org = "n-wh"
	projectName = "java-spring-boot"
	authToken = System.getenv("SENTRY_AUTH_TOKEN")
}

tasks.named('test') {
	useJUnitPlatform()
}
